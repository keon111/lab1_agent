name: C++ CI

on:
  push:
    branches:
      - '**develop**'
      - '**master**'
  pull_request:
    branches:
      - '**develop**'
      - '**master**'

jobs:
  cross_build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and Test
        run: bash ci.sh
        shell: bash

      - name: Deploy
        uses: actions/upload-artifact@v4
        with:
          name: hello-${{ matrix.os }}
          path: |
            build/hello
            build/Release/hello.exe
          if-no-files-found: error
